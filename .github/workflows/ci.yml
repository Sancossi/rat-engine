name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_vault.py
      - run: python -m unittest discover -s scripts/tests

  release:
    name: Release and full GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Ensure Ninja
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --yes }
      - name: Linux graphics and virtual audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev xvfb xauth pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rat_ci
          pactl set-default-sink rat_ci
      - run: cmake --preset gui-release
      - run: cmake --build --preset gui-release --parallel 3
      - name: Unit and mechanics tests
        run: ctest --preset gui-release -LE gui
      - name: Verified WARP full GUI suite
        if: runner.os == 'Windows'
        run: ctest --preset gui-release -L gui
      - name: Mesa software OpenGL full GUI suite
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s '-screen 0 3840x2160x24' ctest --preset gui-release -L gui
      - name: Create relocatable package
        run: cpack --config build/gui-release/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build/packages/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}
          path: |
            build/gui-release/gui-artifacts
            build/gui-release/Testing/Temporary
          if-no-files-found: warn

  headless:
    name: Fresh headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Ensure Ninja
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --yes }
      - name: Headless build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # No graphics/audio packages and no build-cache restore in this job.
      - run: cmake --preset headless-release -DRAT_BUILD_BENCHMARKS=ON
      - run: cmake --build --preset headless-release --parallel 3
      - run: ctest --preset headless-release
      - name: Release benchmark baseline
        shell: python
        run: |
          import os, subprocess
          suffix = '.exe' if os.name == 'nt' else ''
          subprocess.run(['python', 'scripts/run_benchmark.py', '--executable',
                          'build/headless-release/benchmarks/rat-benchmark' + suffix,
                          '--map', 'data/maps/grey_yard.json', '--output',
                          'build/benchmark.json'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-evidence-${{ matrix.os }}
          path: |
            build/benchmark.json
            build/headless-release/Testing/Temporary
            build/headless-release/rat_core_link_closure.txt

  sanitizers:
    name: Linux Debug ASan and UBSan headless
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset headless-sanitizers
      - run: cmake --build --preset headless-sanitizers --parallel 3
      - run: ctest --preset headless-sanitizers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-evidence
          path: build/headless-sanitizers/Testing/Temporary

  analysis:
    name: Clang analyzer own core and editor logic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python -m pip install clang-tidy==22.1.8
      - run: cmake --preset headless-release
      - run: cmake --build --preset headless-release --parallel 3
      - run: python scripts/run_clang_tidy.py --build-dir build/headless-release --artifact-dir build/tidy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-tidy-evidence
          path: build/tidy

  installed-package:
    name: Source-absent downloaded package (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Deliberately NO checkout: the source tree is absent in this fresh job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ runner.temp }}/downloaded
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 xvfb xauth pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rat_ci
          pactl set-default-sink rat_ci
      - name: Extract package and prove checkout absent
        shell: python
        run: |
          import os, pathlib, zipfile
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          assert not (workspace / '.git').exists()
          assert not (workspace / 'src').exists()
          assert not (workspace / 'CMakeLists.txt').exists()
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          archives = list((root / 'downloaded').glob('*.zip'))
          assert len(archives) == 1
          destination = root / 'installed package'
          with zipfile.ZipFile(archives[0]) as archive:
              archive.extractall(destination)
              if os.name != 'nt':
                  for entry in archive.infolist():
                      mode = entry.external_attr >> 16
                      if mode:
                          (destination / entry.filename).chmod(mode & 0o777)
          scripts = list(destination.glob('*/run_gui_acceptance.py'))
          assert len(scripts) == 1
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('RAT_INSTALLED_SCRIPT=' + str(scripts[0]) + '\n')
          (root / 'unrelated cwd').mkdir()
      - name: Full installed suite without source resources
        shell: python
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          command = ['python', os.environ['RAT_INSTALLED_SCRIPT'],
                     '--user-data-dir', str(root / 'package users'),
                     '--artifact-dir', str(root / 'package artifacts'), '--renderer',
                     'software-d3d11' if os.name == 'nt' else 'software-opengl']
          if os.name != 'nt':
              command = ['xvfb-run', '-a', '-s', '-screen 0 3840x2160x24'] + command
          subprocess.run(command, cwd=root / 'unrelated cwd', timeout=300, check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-package-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/package artifacts
